name: Docker image

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/docker-image.yml
      - build-image.sh
      - cloud-init/**
      - config/**
      - docker/**
      - lib/**
      - wipe-workspace.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: agent-vm:test
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm agent-vm:test --help
          docker run --rm --entrypoint bash agent-vm:test -c '
            set -e
            qemu-system-x86_64 --version
            qemu-img --version
            command -v cloud-localds socat ssh ssh-keygen jq
            for script in /opt/agent-vm/*.sh /opt/agent-vm/docker/*.sh; do bash -n "$script"; done
          '

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
