# Keep the standard Ctrl+B bindings.
set -g history-limit 50000
set -g renumber-windows on

# Responsive Escape handling and focus reporting for terminal applications.
set -s escape-time 10
set -g focus-events on
set -g default-terminal tmux-256color

# Blue session badge, lavender active window, and quiet inactive panes.
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left '#[bold,bg=colour24,fg=colour117] #S #[default] '
set -g status-left-length 24
set -g status-right '#{?client_prefix,#[bold fg=colour222] PREFIX ,}#{?#{>=:#{client_width},90},#[fg=colour245] Ctrl+B |,}#[fg=colour117] %H:%M '
set -g status-right-length 30
set -g status-interval 5
set -g status-justify left
setw -g window-status-format ' #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-style 'fg=colour245,bg=colour235'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-style 'bold,fg=colour235,bg=colour183'
setw -g window-status-separator ''
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour75'
set -g message-style 'fg=colour117,bg=colour237'
set -g message-command-style 'fg=colour183,bg=colour237'
set -g display-panes-colour colour245
set -g display-panes-active-colour colour117
