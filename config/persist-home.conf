# type  path under /home/agent  path under /workspace
#
# Supported types:
#   dir   persistent directory
#   file  persistent file, created empty when missing
#   json  persistent JSON file, initialized to {} when missing or empty

dir   .codex         .agent-state/codex
dir   .claude        .agent-state/claude
json  .claude.json   .agent-state/claude.json

dir   .config/gh     .home-state/config/gh
file  .gitconfig     .home-state/gitconfig
file  .bash_history  .home-state/bash_history
file  .ssh/known_hosts .home-state/ssh/known_hosts

# Other SSH state, including private keys, is intentionally opt-in. Replace the
# known_hosts entry above with this directory entry to persist all of .ssh.
# dir .ssh .home-state/ssh
